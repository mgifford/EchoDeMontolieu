name: Sync to Hugging Face Space

# Pushes main to the Space, which then rebuilds from the Dockerfile.
# Needs a repository secret named HF_TOKEN: a Hugging Face access token with write
# access to the Space. The token is never printed; GitHub masks secrets in logs.
# This force-pushes, replacing the Space's own history with this repository's.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.repository == 'mgifford/EchoDeMontolieu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "The HF_TOKEN repository secret is not set." >&2
            exit 1
          fi
          git push --force \
            "https://mgifford:${HF_TOKEN}@huggingface.co/spaces/mgifford/EchoDeMontolieu" \
            HEAD:main
