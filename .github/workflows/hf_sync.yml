name: Sync to Hugging Face Space

# Pushes a snapshot of main (without archive/) to the Space, which then rebuilds from the Dockerfile.
# Needs a repository secret named HF_TOKEN: a Hugging Face access token with write
# access to the Space. The token is never printed; GitHub masks secrets in logs.
# This force-pushes, replacing the Space's history with a single snapshot commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.repository == 'mgifford/EchoDeMontolieu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "The HF_TOKEN repository secret is not set." >&2
            exit 1
          fi
          # Hugging Face rejects git pushes that contain binary files, in any commit of the history. The
          # Space does not use archive/ (the 2003-2008 originals stay on GitHub), so push one snapshot
          # commit of the tree without it. The Space's history is replaced each time, as before.
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan space-snapshot
          git rm -r -q --cached archive
          git commit -q -m "Snapshot of ${GITHUB_SHA} for the Space (without archive/)"
          git push --force \
            "https://mgifford:${HF_TOKEN}@huggingface.co/spaces/mgifford/EchoDeMontolieu" \
            HEAD:main
